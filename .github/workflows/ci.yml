name: CI

on: push

permissions:
  contents: read

jobs:
  build:
    name: Check Watchtower configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - name: Evaluate the flake
        run: nix flake check . --no-build
